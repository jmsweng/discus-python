[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discuspdf-starter"
version = "0.1.0"
description = "Minimal Jupyter-friendly DISCUS PDF automation prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel>=6", "h5py>=3.9"]
dev = ["pytest>=7"]
data = ["h5py>=3.9", "xarray>=2023.1"]
viz = ["scikit-image>=0.21"]
cif = ["gemmi>=0.7.5"]
ase = ["ase>=3.29"]
diffpy = ["diffpy.structure>=3.2.3"]
interop = ["gemmi>=0.7.5", "ase>=3.29", "diffpy.structure>=3.2.3"]
reference = ["xraydb>=4.5", "periodictable>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "discus_live: tests that run the real DISCUS 6.23.01 engine (opt-in via DISCUS_LIVE=1)",
]
